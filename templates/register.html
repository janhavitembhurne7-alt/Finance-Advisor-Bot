{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block auth_content %}
<div class="auth-screen">
  <div class="auth-panel">
    <div class="brand brand-auth">
      <span class="brand-mark">₹</span>
      <span class="brand-name">Ledger</span>
    </div>
    <p class="auth-tag">Personal Finance Advisor</p>
    <h1>Start your ledger</h1>
    <p class="auth-sub">Track income and expenses, and get AI-based budgeting suggestions.</p>
    <form method="POST" class="form">
      <label>Name
        <input type="text" name="name" required autofocus placeholder="Your name">
      </label>
      <label>Email
        <input type="email" name="email" required placeholder="you@example.com">
      </label>
      <label>Password
        <input type="password" name="password" required placeholder="At least 6 characters">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
